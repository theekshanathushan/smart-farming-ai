name: agri_ai
description: Offline-first agricultural AI app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  go_router: ^13.2.0
  tflite_flutter: ^0.12.1
  http: ^1.6.0
  image_picker: ^1.1.2
  image: ^4.2.0
  permission_handler: ^13.0.1
  google_fonts: ^6.1.0
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_auth: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/models/model.tflite
    - assets/models/labels.txt
    - assets/images/
